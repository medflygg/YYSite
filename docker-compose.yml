services:
  web:
    build: .
    container_name: yysite
    restart: unless-stopped
    ports:
      # Only localhost — put Caddy/Nginx in front for HTTPS
      - "127.0.0.1:4321:4321"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: production
      DATABASE_URL: file:./data/yysite.db
    volumes:
      - yysite-data:/app/data
      - yysite-uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  yysite-data:
  yysite-uploads:
